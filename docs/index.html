<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyecto COLFLUX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; color: #1a2236; background: #fff;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; letter-spacing: -.02em; color: #0d4f40; margin-bottom: 12px; }
    p { font-size: 1.05rem; color: #64748b; margin-bottom: 28px; }
    a {
      display: inline-block; background: #18735d; color: white; text-decoration: none;
      font-weight: 700; padding: 12px 28px; border-radius: 8px; transition: background .2s;
    }
    a:hover { background: #125845; }
  </style>
</head>
<body>
  <div>
    <h1>Proyecto COLFLUX</h1>
    <p>Sistema de monitoreo de Gases de Efecto Invernadero. La interfaz de usuario vive en el frontend.</p>
    <a id="frontend-link" href="http://localhost:3000">Ir a la aplicación →</a>
  </div>
  <script>
    var isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
    if (!isLocal) document.getElementById('frontend-link').href = 'http://44.213.47.34/';
  </script>
</body>
</html>
