<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COLFLUX — Datos cargados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; color: #1a2236; background: #f8fafc; line-height: 1.6; }

    :root {
      --green:   #18735d; --green-l: #e6f4f0; --green-d: #0d4f40;
      --blue:    #1a6e9b; --blue-l:  #e6f3fb;
      --purple:  #6b4f9e; --purple-l:#f0ecfa;
      --amber:   #d97706; --amber-l: #fef3c7;
      --red:     #dc2626; --red-l:   #fee2e2;
      --gray:    #64748b; --gray-l:  #f1f5f9;
      --border:  #e2e8f0;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); padding: 12px 0;
    }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1400px; margin: 0 auto; padding: 0 24px; }
    .nav-logo { font-weight: 800; font-size: 1rem; color: var(--green-d); text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--gray); font-size: .85rem; font-weight: 500; text-decoration: none; transition: color .2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--green); font-weight: 700; }
    .nav-pill { background: var(--green-d); color: white; font-size: .75rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; text-decoration: none; }
    @media (max-width: 600px) { .nav-links { display: none; } }

    .hero { background: #0d4f40; color: white; padding: 40px 0 28px; }
    .hero-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-radius: 20px; padding: 4px 14px; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 14px; }
    .hero h1 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; margin-bottom: 6px; }
    .hero h1 em { font-style: normal; color: #6ee7b7; }
    .hero p { font-size: .88rem; color: rgba(255,255,255,.8); }

    .toolbar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
      padding: 16px 0; border-bottom: 1px solid var(--border); background: white;
    }
    .toolbar-info { font-size: .84rem; color: var(--gray); }
    .toolbar-actions { display: flex; align-items: center; gap: 10px; }
    .btn-secondary { background: white; color: var(--gray); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: .84rem; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none; }
    .btn-secondary:hover { border-color: var(--gray); color: #1a2236; }
    .btn-secondary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--green-d); color: white; border: none; border-radius: 8px; padding: 8px 16px; font-size: .84rem; font-weight: 700; font-family: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-primary:hover { opacity: .9; }

    /* ── Dropdown "Cargar" (fuentes del proyecto) ── */
    .dropdown-wrap { position: relative; }
    .dropdown-panel {
      display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
      background: white; border: 1.5px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.14); width: 280px; padding: 8px;
    }
    .dropdown-panel.open { display: block; }
    .dropdown-label { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--gray); padding: 6px 8px 4px; }
    .dropdown-item {
      display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 8px;
      padding: 8px; font-size: .82rem; font-family: inherit; color: #1a2236; cursor: pointer; text-decoration: none;
    }
    .dropdown-item:hover { background: var(--gray-l); }
    .dropdown-item.active { background: var(--green-l); color: var(--green-d); font-weight: 700; cursor: default; }
    .dropdown-item small { display: block; font-size: .7rem; color: var(--gray); font-weight: 500; }
    .dropdown-empty { padding: 10px 8px; font-size: .8rem; color: var(--gray); }
    .dropdown-sep { border-top: 1px solid var(--border); margin: 6px 0; }
    .dropdown-add-btn {
      display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: none;
      border-radius: 8px; padding: 8px; font-size: .82rem; font-weight: 700; font-family: inherit;
      color: var(--green-d); cursor: pointer;
    }
    .dropdown-add-btn:hover { background: var(--green-l); }

    /* ── Drawer "Nueva fuente" (reutilizado de data.html) ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100vw;
      background: white; z-index: 201; box-shadow: -8px 0 32px rgba(0,0,0,.15);
      transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .drawer-header h3 { font-size: 1.05rem; font-weight: 800; }
    .drawer-close {
      background: none; border: none; cursor: pointer; color: var(--gray);
      font-size: 1.3rem; line-height: 1; padding: 4px; border-radius: 6px;
      transition: background .15s;
    }
    .drawer-close:hover { background: var(--gray-l); color: #1a2236; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group label { font-size: .8rem; font-weight: 700; color: #374151; }
    .field-group label span { color: var(--red); margin-left: 2px; }
    .field-group input, .field-group select, .field-group textarea {
      border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 12px;
      font-size: .88rem; font-family: inherit; color: #1a2236; background: white;
      outline: none; transition: border-color .2s; width: 100%;
    }
    .field-group input:focus, .field-group select:focus, .field-group textarea:focus { border-color: var(--green); }
    .field-group textarea { resize: vertical; min-height: 80px; }
    .field-hint { font-size: .75rem; color: var(--gray); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .drawer-footer {
      padding: 16px 24px; border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: center;
    }
    .btn-submit {
      flex: 1; background: var(--green-d); color: white; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: .88rem; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: opacity .2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover { opacity: .9; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
    .btn-cancel {
      background: white; color: var(--gray); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 10px 16px; font-size: .88rem; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: border-color .2s;
    }
    .btn-cancel:hover { border-color: var(--gray); color: #1a2236; }
    .form-error { font-size: .8rem; color: var(--red); font-weight: 600; }

    .estado-box { padding: 40px 0; text-align: center; color: var(--gray); font-size: .9rem; }
    .error-box { background: var(--red-l); color: var(--red); border-radius: 10px; padding: 14px 18px; font-size: .85rem; margin: 20px 0; }
    .warn-box { background: var(--amber-l); color: #92400e; border-radius: 10px; padding: 14px 18px; font-size: .85rem; margin: 20px 0; }

    .tabla-wrap { overflow-x: auto; margin: 20px 0; border: 1.5px solid var(--border); border-radius: 12px; background: white; }
    table.datos-table { border-collapse: collapse; font-size: .78rem; white-space: nowrap; }
    table.datos-table th, table.datos-table td { padding: 7px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
    table.datos-table td { color: #1a2236; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
    table.datos-table tr:hover td { background: var(--gray-l); }
    table.datos-table tr:nth-child(even) td { background: #fafbfc; }

    .th-modelo-row th {
      font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
      padding: 5px 12px; text-align: left; color: white;
    }
    .th-campo-row th {
      font-size: .72rem; font-weight: 700; text-align: left; color: #374151; background: var(--gray-l);
    }
    .th-filtro-row th { background: white; padding: 4px 8px; }
    .th-filtro-row input {
      width: 100%; border: 1.5px solid var(--border); border-radius: 6px; padding: 4px 8px;
      font-size: .74rem; font-family: inherit;
    }
    .th-filtro-row input:focus { border-color: var(--green); outline: none; }

    .th-regla-row th { padding: 4px 8px; text-align: left; }
    .btn-validacion {
      display: inline-flex; align-items: center; gap: 5px; background: white; border: 1.5px solid var(--border);
      border-radius: 7px; padding: 3px 9px; font-size: .72rem; font-weight: 600; font-family: inherit;
      color: var(--gray); cursor: pointer;
    }
    .btn-validacion:hover { border-color: var(--green); color: var(--green-d); }
    .btn-validacion[data-con-pendientes="true"] { border-color: var(--amber); color: #92400e; }
    .badge-pendientes {
      background: var(--amber); color: white; border-radius: 10px; padding: 1px 6px; font-size: .68rem; font-weight: 700;
    }

    .tabs { display: flex; gap: 6px; margin: 20px 0 0; }
    .tab-btn {
      background: white; border: 1.5px solid var(--border); border-bottom: none; border-radius: 10px 10px 0 0;
      padding: 8px 16px; font-size: .84rem; font-weight: 600; font-family: inherit; color: var(--gray); cursor: pointer;
    }
    .tab-btn.active { color: var(--green-d); background: var(--green-l); border-color: var(--green); }

    .paginacion { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 16px 0 32px; font-size: .84rem; color: var(--gray); }

    footer { background: #0d1117; color: rgba(255,255,255,.5); padding: 28px 0; font-size: .82rem; margin-top: 40px; }
  </style>
</head>
<body>

<div id="app-nav"></div>

<div class="hero">
  <div class="container">
    <div class="hero-badge">📊 ETL · Datos cargados</div>
    <h1>Vista <em>desnormalizada</em> de lo importado</h1>
    <p id="heroSubtitulo">Cargando…</p>
  </div>
</div>

<div class="container">
  <div class="tabs" id="tabsVistas"></div>

  <div class="toolbar">
    <div class="toolbar-info" id="toolbarInfo"></div>
    <div class="toolbar-actions">
      <button class="btn-secondary" id="btnLimpiarFiltros" style="display:none;">✕ Limpiar filtros</button>
      <div class="dropdown-wrap" id="cargarDropdownWrap">
        <button class="btn-secondary" id="btnCargar" type="button">⬆ Cargar ▾</button>
        <div class="dropdown-panel" id="cargarDropdownPanel">
          <div class="dropdown-label" id="cargarDropdownLabel">Fuentes de este proyecto</div>
          <div id="cargarDropdownList"><div class="dropdown-empty">Cargando…</div></div>
          <div class="dropdown-sep"></div>
          <button type="button" class="dropdown-add-btn" id="btnNuevaFuente">＋ Agregar nueva fuente</button>
        </div>
      </div>
      <button class="btn-secondary" id="btnDescargarCsv">⬇ Descargar Excel</button>
      <a class="btn-secondary" id="linkVolver" href="etl-upload.html">← Volver al ETL</a>
    </div>
  </div>

  <div id="contenido">
    <div class="estado-box">Cargando datos…</div>
  </div>
</div>

<div id="app-footer"></div>

<script src="../assets/js/layout.js"></script>
<script src="../assets/js/role-guard.js"></script>
<script src="../config/services.js"></script>
<script src="../assets/js/data-page/fuente-drawer.js"></script>
<script>
  const API_BASE = window.COLFLUX_CONFIG.apiBaseUrl;
  const params = new URLSearchParams(window.location.search);
  const fuenteId = params.get('fuente');
  const cargaId = params.get('carga');

  const proyectoId = params.get('proyecto');
  let proyectoNombre = null;
  let proyectoActualId = proyectoId || null;
  const dropdownData = { proyectos: [], fuentes: [] };

  // Una única fila de pestañas: CO₂/CH₄ son la vista "submuestra_gei" con un
  // filtro de gas fijo, no una vista aparte — así queda todo en una sola
  // línea en vez de "vista" + "gas" como dos filas de tabs anidadas. La
  // exportación (_HOJAS_EXPORT en el backend) usa la misma partición.
  const TABS = [
    { id: 'CO2', label: 'CO₂', vista: 'submuestra_gei', gas: 'CO2' },
    { id: 'CH4', label: 'CH₄', vista: 'submuestra_gei', gas: 'CH4' },
    { id: 'unidad_muestreo', label: 'Unidad de Muestreo / Experimental', vista: 'unidad_muestreo', gas: null },
    { id: 'clima', label: 'Clima', vista: 'clima', gas: null },
    { id: 'mom', label: 'MOM', vista: 'mom', gas: null },
    { id: 'cos', label: 'COS', vista: 'cos', gas: null },
    { id: 'biomasa', label: 'Biomasa', vista: 'biomasa', gas: null },
  ];

  function tabActual() {
    return TABS.find(t => t.id === state.tab) || TABS[0];
  }

  function filtroBaseTab() {
    const tab = tabActual();
    return tab.gas ? { 'MuestraGEI.gas': tab.gas } : {};
  }

  const state = {
    tab: 'CO2', offset: 0, limite: 200, total: 0, columnas: [], filas: [], filtros: { 'MuestraGEI.gas': 'CO2' },
    reglas: {},
  };

  // Colores por modelo, para agrupar visualmente las columnas de la tabla
  // (cada modelo de la cadena SubmuestraGEI → … → Sitio tiene su color).
  const COLORES_MODELO = {
    SubmuestraGEI: '#0d4f40', MuestraGEI: '#18735d', UnidadMedida: '#1a6e9b',
    MuestraAmbiental: '#6b4f9e', Equipo: '#b45309',
    UnidadMuestreo: '#1a6e9b', UnidadExperimental: '#166534',
    UnidadMuestreoTipo: '#65a30d', Sitio: '#7c3aed', Parcela: '#0e7490',
    MuestraMOM: '#92400e', SubmuestraSuelo: '#854d0e',
    IndividuoArboreo: '#166534', MuestraBiomasa: '#15803d',
  };

  if (fuenteId) {
    document.getElementById('linkVolver').href = `etl-upload.html?fuente=${encodeURIComponent(fuenteId)}`;
  } else if (proyectoId) {
    const linkVolver = document.getElementById('linkVolver');
    linkVolver.href = 'data.html';
    linkVolver.textContent = '← Volver a Gestión de Datos';
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderTabs() {
    const tabsEl = document.getElementById('tabsVistas');
    tabsEl.innerHTML = TABS.map(t => `
      <button type="button" class="tab-btn ${t.id === state.tab ? 'active' : ''}" data-tab="${t.id}">
        ${escapeHtml(t.label)}
      </button>
    `).join('');
    tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.tab === state.tab) return;
        state.tab = btn.dataset.tab;
        state.offset = 0;
        state.filtros = filtroBaseTab();
        cargarDatos();
      });
    });
  }

  let debounceFiltro = null;
  function onFiltroInput(input) {
    const clave = input.dataset.clave;
    const valor = input.value;
    if (valor) state.filtros[clave] = valor;
    else delete state.filtros[clave];
    state.filtroEnFoco = { clave, cursor: input.selectionStart };
    clearTimeout(debounceFiltro);
    debounceFiltro = setTimeout(() => {
      state.offset = 0;
      cargarDatos();
    }, 400);
  }

  function renderTabla() {
    const contenido = document.getElementById('contenido');
    const hayFiltrosExtra = Object.keys(state.filtros).length > Object.keys(filtroBaseTab()).length;
    document.getElementById('btnLimpiarFiltros').style.display = hayFiltrosExtra ? 'inline-block' : 'none';

    if (!state.columnas.length) {
      contenido.innerHTML = `<div class="warn-box">${escapeHtml(state.advertencia || 'No hay datos para mostrar todavía.')}</div>`;
      return;
    }


    const grupos = [];
    state.columnas.forEach(c => {
      const ultimo = grupos[grupos.length - 1];
      if (ultimo && ultimo.modelo === c.modelo) ultimo.count++;
      else grupos.push({ modelo: c.modelo, count: 1 });
    });

    const theadModelo = grupos.map(g =>
      `<th colspan="${g.count}" style="background:${COLORES_MODELO[g.modelo] || '#374151'};">${escapeHtml(g.modelo)}</th>`
    ).join('');
    const theadCampo = state.columnas.map(c =>
      `<th title="${escapeHtml(c.clave)}">${escapeHtml(c.verbose_name || c.campo)}</th>`
    ).join('');
    const theadFiltro = state.columnas.map(c => `
      <th>
        <input type="text" placeholder="filtrar…" data-clave="${escapeHtml(c.clave)}" value="${escapeHtml(state.filtros[c.clave] || '')}">
      </th>
    `).join('');
    const hayReglas = state.columnas.some(c => state.reglas[c.clave]);
    const theadRegla = hayReglas ? state.columnas.map(c => {
      const regla = state.reglas[c.clave];
      if (!regla) return '<th></th>';
      const tienePendientes = regla.pendientes > 0;
      return `<th>
        <button type="button" class="btn-validacion" title="${escapeHtml(regla.nombre)}"
          data-ver-campo="${escapeHtml(c.clave)}" data-con-pendientes="${tienePendientes}">
          🛡️ Validación${tienePendientes ? `<span class="badge-pendientes">${regla.pendientes}</span>` : ''}
        </button>
      </th>`;
    }).join('') : '';

    const filasHtml = state.filas.map(fila => {
      const celdas = state.columnas.map(c => {
        const v = fila[c.clave];
        return `<td>${v === null || v === undefined ? '' : escapeHtml(v)}</td>`;
      }).join('');
      return `<tr>${celdas}</tr>`;
    }).join('');

    contenido.innerHTML = `
      <div class="tabla-wrap">
        <table class="datos-table">
          <thead>
            <tr class="th-modelo-row">${theadModelo}</tr>
            <tr class="th-campo-row">${theadCampo}</tr>
            ${hayReglas ? `<tr class="th-regla-row">${theadRegla}</tr>` : ''}
            <tr class="th-filtro-row">${theadFiltro}</tr>
          </thead>
          <tbody>${filasHtml}</tbody>
        </table>
      </div>
      <div class="paginacion">
        <button class="btn-secondary" id="btnAnterior" ${state.offset === 0 ? 'disabled' : ''}>← Anterior</button>
        <span>${state.total ? state.offset + 1 : 0}–${Math.min(state.offset + state.filas.length, state.total)} de ${state.total}</span>
        <button class="btn-secondary" id="btnSiguiente" ${state.offset + state.limite >= state.total ? 'disabled' : ''}>Siguiente →</button>
      </div>
    `;

    contenido.querySelectorAll('.th-filtro-row input').forEach(input => {
      input.addEventListener('input', () => onFiltroInput(input));
    });

    // Restaura foco + posición del cursor tras un re-render disparado por el
    // propio filtro (si no, el usuario pierde el foco a cada tecla).
    if (state.filtroEnFoco) {
      const input = contenido.querySelector(`.th-filtro-row input[data-clave="${CSS.escape(state.filtroEnFoco.clave)}"]`);
      if (input) {
        input.focus();
        input.setSelectionRange(state.filtroEnFoco.cursor, state.filtroEnFoco.cursor);
      }
    }
    document.getElementById('btnAnterior')?.addEventListener('click', () => {
      state.offset = Math.max(state.offset - state.limite, 0);
      cargarDatos();
    });
    document.getElementById('btnSiguiente')?.addEventListener('click', () => {
      state.offset += state.limite;
      cargarDatos();
    });

    contenido.querySelectorAll('[data-ver-campo]').forEach(btn => {
      btn.addEventListener('click', () => {
        const qs = new URLSearchParams({ campo: btn.dataset.verCampo, fuente: fuenteId || '', carga: cargaId || '' });
        window.location.href = `reglas-campo.html?${qs}`;
      });
    });
  }

  async function cargarReglas() {
    try {
      const res = await fetch(`${API_BASE}/api/reglas-autollenado/`);
      const data = await res.json().catch(() => ({}));
      state.reglas = {};
      (data.reglas || []).forEach(r => {
        state.reglas[`${r.modelo_destino}.${r.campo_destino}`] = r;
      });
    } catch (e) {
      // Sin reglas disponibles no es un error bloqueante para ver los datos.
      state.reglas = {};
    }
  }

  async function cargarDatos() {
    if (!proyectoId && (!fuenteId || !cargaId)) {
      document.getElementById('contenido').innerHTML =
        '<div class="error-box">Falta indicar la fuente y la carga, o el proyecto (parámetros ?fuente=&carga= o ?proyecto= en la URL).</div>';
      return;
    }

    // Al re-filtrar/paginar ya hay una tabla en pantalla: no se reemplaza por
    // el estado "Cargando…" (eso le quitaría el foco al input de filtro a
    // cada tecla). Solo se muestra en la carga inicial o al cambiar de vista.
    if (!state.columnas.length) {
      document.getElementById('contenido').innerHTML = '<div class="estado-box">Cargando datos…</div>';
    }
    try {
      const qs = new URLSearchParams({
        offset: state.offset, limite: state.limite, vista: tabActual().vista,
        filtros: JSON.stringify(state.filtros),
      });
      const url = proyectoId
        ? `${API_BASE}/api/proyectos/${proyectoId}/datos/?${qs}`
        : `${API_BASE}/api/fuentes-datos/${fuenteId}/carga/${cargaId}/datos/?${qs}`;
      const res = await fetch(url, {
        signal: AbortSignal.timeout(Math.max(window.COLFLUX_CONFIG.requestTimeoutMs, 30000)),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      state.total = data.total || 0;
      state.columnas = data.columnas || [];
      state.filas = data.filas || [];
      state.advertencia = data.advertencia;

      const origen = proyectoId
        ? (proyectoNombre || `Proyecto #${proyectoId}`)
        : (proyectoNombre ? `${proyectoNombre} · Carga #${cargaId}` : `Carga #${cargaId}`);
      document.getElementById('heroSubtitulo').textContent =
        `${origen} — ${tabActual().label}.`;
      document.getElementById('toolbarInfo').textContent =
        state.total ? `${state.total} registro${state.total === 1 ? '' : 's'} · ${state.columnas.length} columnas` : 'Sin registros';

      renderTabs();
      renderTabla();
    } catch (e) {
      document.getElementById('contenido').innerHTML =
        `<div class="error-box">Error al cargar los datos: ${escapeHtml(e.message)}</div>`;
    }
  }

  document.getElementById('btnLimpiarFiltros').addEventListener('click', () => {
    state.filtros = filtroBaseTab();
    state.filtroEnFoco = null;
    state.offset = 0;
    cargarDatos();
  });

  document.getElementById('btnDescargarCsv').addEventListener('click', () => {
    window.location.href = proyectoId
      ? `${API_BASE}/api/proyectos/${proyectoId}/exportar/`
      : `${API_BASE}/api/fuentes-datos/${fuenteId}/carga/${cargaId}/exportar/`;
  });

  async function cargarNombreProyecto() {
    if (!proyectoId) return;
    try {
      const res = await fetch(`${API_BASE}/api/fuentes-datos/?proyecto=${encodeURIComponent(proyectoId)}`);
      const data = await res.json().catch(() => ({}));
      const proyecto = (data.proyectos || []).find(p => String(p.id) === String(proyectoId));
      if (proyecto) proyectoNombre = proyecto.nombre;
    } catch (e) { /* si falla, se usa el fallback "Proyecto #id" */ }
  }

  // ── Dropdown "Cargar": fuentes del proyecto actual + acceso a "Nueva fuente" ──
  function renderCargarDropdown() {
    const lista = document.getElementById('cargarDropdownList');
    document.getElementById('cargarDropdownLabel').textContent =
      proyectoNombre ? `Fuentes de ${proyectoNombre}` : 'Fuentes de este proyecto';
    const fuentesProyecto = dropdownData.fuentes.filter(f =>
      (f.proyecto?.id ?? null) === (proyectoActualId ? Number(proyectoActualId) : null)
    );
    if (!fuentesProyecto.length) {
      lista.innerHTML = '<div class="dropdown-empty">Este proyecto todavía no tiene fuentes.</div>';
      return;
    }
    lista.innerHTML = fuentesProyecto.map(f => {
      const esActual = fuenteId && String(f.id) === String(fuenteId);
      return esActual
        ? `<span class="dropdown-item active">${escapeHtml(f.nombre)}<small>Viendo esta fuente</small></span>`
        : `<a class="dropdown-item" href="etl-upload.html?fuente=${encodeURIComponent(f.id)}">${escapeHtml(f.nombre)}<small>${escapeHtml(f.tipo_label || f.tipo || '')}</small></a>`;
    }).join('');
  }

  async function cargarFuentesDropdown() {
    try {
      const url = proyectoActualId
        ? `${API_BASE}/api/fuentes-datos/?proyecto=${encodeURIComponent(proyectoActualId)}`
        : `${API_BASE}/api/fuentes-datos/`;
      const res = await fetch(url);
      const data = await res.json().catch(() => ({}));
      dropdownData.proyectos = data.proyectos || [];
      dropdownData.fuentes = data.fuentes || [];

      if (!proyectoActualId && fuenteId) {
        const actual = dropdownData.fuentes.find(f => String(f.id) === String(fuenteId));
        if (actual?.proyecto?.id) {
          proyectoActualId = actual.proyecto.id;
          if (!proyectoNombre) proyectoNombre = actual.proyecto.nombre;
        }
      }
    } catch (e) {
      document.getElementById('cargarDropdownList').innerHTML =
        '<div class="dropdown-empty">No se pudieron cargar las fuentes.</div>';
      return;
    }
    renderCargarDropdown();
  }

  function toggleCargarDropdown(mostrar) {
    document.getElementById('cargarDropdownPanel').classList.toggle('open', mostrar);
  }

  document.getElementById('btnCargar').addEventListener('click', (e) => {
    e.stopPropagation();
    const panel = document.getElementById('cargarDropdownPanel');
    toggleCargarDropdown(!panel.classList.contains('open'));
  });
  document.addEventListener('click', (e) => {
    if (!document.getElementById('cargarDropdownWrap').contains(e.target)) toggleCargarDropdown(false);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') toggleCargarDropdown(false);
  });
  document.getElementById('btnNuevaFuente').addEventListener('click', () => {
    toggleCargarDropdown(false);
    window.openDrawer();
  });

  window.COLFLUX_DATA.fuenteDrawer.init({
    getData: () => dropdownData,
    getActiveProyecto: () => proyectoActualId,
    getApiBase: () => API_BASE,
    onRender: cargarFuentesDropdown,
  });

  (async () => {
    await cargarNombreProyecto();
    // Resuelve el proyecto (y su nombre) antes de pintar el subtítulo y la
    // tabla, para que la vista quede identificada con su proyecto tanto si
    // se llega por ?fuente=&carga= como por ?proyecto=.
    await cargarFuentesDropdown();
    await cargarReglas();
    await cargarDatos();
  })();
</script>
</body>
</html>
