services:
  web:
    build: .
    # --workers 4 --timeout 60: por defecto gunicorn corre con 1 worker sync
    # y timeout de 30s — con la RDS remota (latencia de red por query) y las
    # ~15 peticiones concurrentes que dispara el dashboard del geoportal, un
    # solo worker se satura y se reinicia a medio proceso.
    command: sh -c "python manage.py migrate && python manage.py create_admin_from_env && python manage.py generate_catalogo && python manage.py collectstatic --noinput && (python manage.py check_usuarios_huerfanos || true) && gunicorn colflux.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL debe estar seteada en .env — no hay fallback silencioso a la db local}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      LOAD_SEED_DATA: ${LOAD_SEED_DATA:-}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - .:/app
